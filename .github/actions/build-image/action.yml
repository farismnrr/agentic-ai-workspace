name: Build and publish the image
description: Build the Docker image, smoke-test it, and optionally push it to GHCR as <channel> and sha-<commit>.
inputs:
  channel:
    description: Moving tag to publish, such as dev or latest.
    required: true
  push:
    description: Push to GHCR after the smoke test passes ("true" or "false").
    default: "false"
  token:
    description: Token with packages:write, needed only when pushing.
    default: ""
  suffix:
    description: Appended to the image name; "-sandbox" builds the toolbox image the agent's commands run in.
    default: ""
  dockerfile:
    description: Dockerfile to build, relative to the repository root.
    default: Dockerfile
  smoke:
    description: Smoke-test script, run with the built image as its argument.
    default: scripts/smoke-test-image.sh
outputs:
  digest:
    description: Digest of the pushed image (empty when not pushed).
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}${{ inputs.suffix }}
        tags: |
          type=raw,value=${{ inputs.channel }}
          type=sha,prefix=sha-,format=short
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        load: true
        tags: agentic-ai-workspace${{ inputs.suffix }}:ci
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=image${{ inputs.suffix }}
        cache-to: type=gha,mode=max,scope=image${{ inputs.suffix }}
    - shell: bash
      run: sh ${{ inputs.smoke }} agentic-ai-workspace${{ inputs.suffix }}:ci
    - if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - id: push
      if: inputs.push == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=image${{ inputs.suffix }}

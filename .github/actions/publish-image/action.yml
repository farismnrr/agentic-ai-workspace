name: Publish a tested image artifact
description: Load the smoke-tested image archive and push its moving and commit tags.
inputs:
  token:
    description: GitHub token with packages:write.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: app-image
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=dev
          type=sha,prefix=sha-,format=short
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - shell: bash
      env:
        IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -eu
        docker load --input app-image.tar
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          docker tag agentic-ai-workspace:ci "$tag"
          docker push "$tag"
        done <<EOF
        $IMAGE_TAGS
        EOF

name: Bootstrap Three.js lock

on:
  push:
    paths:
      - "web/package.json"
      - ".github/workflows/bootstrap-three-lock.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-three-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Refresh deterministic lockfile
        run: npm --prefix web install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove bootstrap workflow
        run: rm .github/workflows/bootstrap-three-lock.yml

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: lock Three.js dependency"
          git push

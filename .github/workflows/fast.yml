name: Fast

# Quick feedback loop for development: every quality gate in parallel, then one
# binary build and smoke test, then the image. Pushes to dev publish the dev image to
# GHCR; pull requests only build it. No merge; see full.yml for release.
on:
  push:
    branches: [dev]
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
  pull_request:
    branches: [dev]
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make guardrails

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - run: make frontend-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-dist
          path: internal/platform/webassets/dist
          if-no-files-found: error
          retention-days: 1

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make backend-test

  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          args: ./cmd/... ./internal/...

  build:
    needs: [guardrails, frontend, backend-test, backend-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa-dist
          path: internal/platform/webassets/dist
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make backend-build
      - run: sh scripts/smoke-test.sh bin/agentic-ai-workspace

  image:
    needs: [guardrails, frontend, backend-test, backend-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          channel: dev
          push: ${{ github.event_name == 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-image
        with:
          suffix: -sandbox
          dockerfile: sandbox/Dockerfile
          smoke: scripts/smoke-test-sandbox.sh
          channel: dev
          # Pushes publish :dev and :sha-<short>; only full publishes :latest, which the local app uses.
          push: ${{ github.event_name == 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}

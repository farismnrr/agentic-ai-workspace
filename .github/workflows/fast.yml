name: Fast - publish dev image

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Publish both immutable images before changing the moving dev channel.
      - name: Build and push app (immutable)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and push sandbox (immutable)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-sandbox:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Promote both images to dev after successful publication
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:sha-$COMMIT" >/dev/null
          docker buildx imagetools inspect "$IMAGE-sandbox:sha-$COMMIT" >/dev/null
          docker buildx imagetools create --tag "$IMAGE-sandbox:dev" "$IMAGE-sandbox:sha-$COMMIT"
          docker buildx imagetools create --tag "$IMAGE:dev" "$IMAGE:sha-$COMMIT"

  # An opt-in, disposable-host Docker black-box run: use the marker in a
  # dev commit message once. Ordinary pushes keep the existing fast workflow.
  docker-isolation:
    if: contains(github.event.head_commit.message, '[docker-blackbox]')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Docker isolation on disposable runner
        env:
          SANDBOX_TEST_IMAGE: ghcr.io/${{ github.repository }}-sandbox:sha-${{ github.sha }}
        run: |
          set -o pipefail
          if make volume-isolation 2>&1 | tee "$RUNNER_TEMP/docker-volume-isolation.log"; then
            echo 'PASS Docker volume-isolation'
          else
            # Annotate a bounded failure excerpt: the GitHub API can read it
            # even when the Actions blob log endpoint is blocked by egress.
            python3 -c 'import os,pathlib; t=pathlib.Path(os.environ["RUNNER_TEMP"]+"/docker-volume-isolation.log").read_text(errors="replace")[-3500:]; print("::error title=Docker isolation failure::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi

  # Native Git parity also gets a fresh Docker host and the sandbox image
  # published for this exact SHA.
  docker-git-parity:
    if: contains(github.event.head_commit.message, '[docker-blackbox]')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify pre-action role SOP and restricted Git bridge
        run: go test ./internal/modules/task/application ./internal/modules/coding/domain -run 'Test(BridgeVCSInstructionsAreScopedToServerAuthorizedTools|PreActionToolSOPRespectsEnabledRoleInventory|LeadToolSOPNamesCorrectOwnersBeforeAction)' -count=1
      - name: Verify quota-safe Git allowlist
        run: go test ./internal/modules/coding/adapter/runner -run 'TestQuotaSafeGit' -count=1
      - name: Build app binary for Git parity scenario
        run: make backend-build VERSION="${{ github.sha }}"
      - name: Verify native Git parity on fresh disposable runner
        env:
          APP_BIN: ${{ github.workspace }}/bin/agentic-ai-workspace
          SANDBOX_IMAGE: ghcr.io/${{ github.repository }}-sandbox:sha-${{ github.sha }}
          SANDBOX_TEST_IMAGE: ghcr.io/${{ github.repository }}-sandbox:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if ! ./test/run.sh blackbox 13-researcher-git-parity 2>&1 | tee "$RUNNER_TEMP/docker-git-parity.log"; then
            python3 -c 'import os,pathlib; t=pathlib.Path(os.environ["RUNNER_TEMP"]+"/docker-git-parity.log").read_text(errors="replace")[-3500:]; print("::error title=Native Git parity failure::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          echo 'PASS native Git parity black-box'

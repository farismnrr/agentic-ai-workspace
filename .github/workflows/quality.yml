name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository guardrails
        run: make guardrails

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm --prefix web ci --no-audit --no-fund

      - name: Verify and build frontend
        run: make frontend-verify

      - name: Upload SPA build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-dist
          path: internal/platform/webassets/dist
          if-no-files-found: error
          retention-days: 1

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules and run tests
        run: make backend-test

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run strict Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          args: ./cmd/... ./internal/...

  quality:
    name: quality-gate
    needs:
      - guardrails
      - frontend
      - backend-test
      - backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download verified SPA build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa-dist
          path: internal/platform/webassets/dist

      - name: Compile final Linux AMD64 binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make backend-build

      - name: Prepare release binary
        run: |
          mkdir -p release
          install -m 0755 bin/agentic-ai-workspace release/agentic-ai-workspace-linux-amd64

      - name: Upload verified release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary
          path: release/agentic-ai-workspace-linux-amd64
          if-no-files-found: error
          retention-days: 1

  release:
    name: rolling-latest-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binary
          path: release

      - name: Publish rolling Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          asset="release/agentic-ai-workspace-linux-amd64"
          repo="${GITHUB_REPOSITORY}"
          chmod +x "$asset"

          if gh release view latest --repo "$repo" --json isImmutable >/dev/null 2>&1; then
            immutable="$(gh release view latest --repo "$repo" --json isImmutable --jq '.isImmutable')"
            if [ "$immutable" = "true" ]; then
              echo "The rolling latest release cannot be replaced while immutable releases are enabled." >&2
              exit 1
            fi
          fi

          if gh api "repos/${repo}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${repo}/git/refs/tags/latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${repo}/git/refs" \
              -f ref="refs/tags/latest" -f sha="${GITHUB_SHA}" >/dev/null
          fi

          printf 'Rolling Linux AMD64 build from main.\n\nCommit: `%s`\n' "$GITHUB_SHA" > release-notes.md

          if gh release view latest --repo "$repo" >/dev/null 2>&1; then
            gh release edit latest --repo "$repo" --target "$GITHUB_SHA" --title "Latest" \
              --notes-file release-notes.md --latest
            gh release upload latest "$asset" --repo "$repo" --clobber
          else
            gh release create latest "$asset" --repo "$repo" --verify-tag --title "Latest" \
              --notes-file release-notes.md --latest
          fi

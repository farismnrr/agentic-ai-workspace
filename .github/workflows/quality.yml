name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-lockfile:
    name: bootstrap-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate deterministic lockfile
        run: |
          npm --prefix web install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '---BEGIN PACKAGE-LOCK BASE64---'
          base64 -w 0 web/package-lock.json
          echo
          echo '---END PACKAGE-LOCK BASE64---'

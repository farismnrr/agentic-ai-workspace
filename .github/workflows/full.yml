name: Full

# Manual production release. Re-verifies everything from a clean checkout, then
# merges dev into main and publishes the rolling Latest release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-release
  cancel-in-progress: false

env:
  CI: true
  ASSET: agentic-ai-workspace-linux-amd64

jobs:
  verify:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-frontend
      - run: make verify
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make backend-build
      - run: sh scripts/smoke-test.sh bin/agentic-ai-workspace
      - run: mkdir -p release && install -m 0755 bin/agentic-ai-workspace "release/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary
          path: release/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binary
          path: dist

      - name: Merge dev into main
        id: merge
        run: |
          set -eu
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head dev \
              --title "Release from dev" --body "Automated full release after all checks passed."
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
          fi
          # No --delete-branch: dev must survive the merge.
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge
          sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish rolling Latest release
        env:
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"
          asset="dist/$ASSET"
          chmod +x "$asset"

          if gh release view latest --repo "$repo" --json isImmutable --jq '.isImmutable' 2>/dev/null | grep -qx true; then
            echo "Rolling latest cannot be replaced while immutable releases are enabled." >&2
            exit 1
          fi

          if gh api "repos/${repo}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${repo}/git/refs/tags/latest" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${repo}/git/refs" -f ref="refs/tags/latest" -f sha="$SHA" >/dev/null
          fi

          printf 'Rolling Linux AMD64 build from main.\n\nCommit: `%s`\n' "$SHA" > release-notes.md
          if gh release view latest --repo "$repo" >/dev/null 2>&1; then
            gh release edit latest --repo "$repo" --target "$SHA" --title "Latest" --notes-file release-notes.md --latest
            gh release upload latest "$asset" --repo "$repo" --clobber
          else
            gh release create latest "$asset" --repo "$repo" --verify-tag --title "Latest" --notes-file release-notes.md --latest
          fi

name: Full

# Manual production release. Re-verifies everything from a clean checkout, merges dev
# into main, publishes the image to GHCR as latest, then deploys it to production
# (compose.prod.yaml, port 5004) on the on-premise runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-release
  cancel-in-progress: false

env:
  CI: true

jobs:
  verify:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANDBOX_TEST_IMAGE: ghcr.io/farismnrr/agentic-ai-workspace-sandbox:latest
      STAGE7_IMAGE: ghcr.io/farismnrr/agentic-ai-workspace-sandbox:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-frontend
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install Chromium for the pinned Playwright version
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: docker pull "$SANDBOX_TEST_IMAGE"
      - run: make verify-full

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    permissions:
      contents: write
      pull-requests: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Merge dev into main
        id: merge
        run: |
          set -eu
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head dev \
              --title "Release from dev" --body "Automated full release after all checks passed."
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
          fi
          # No --delete-branch: dev must survive the merge.
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge
          sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.merge.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-image
        with:
          channel: latest
          push: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-image
        with:
          suffix: -sandbox
          dockerfile: sandbox/Dockerfile
          smoke: test/smoke/sandbox.test.sh
          channel: latest
          push: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [publish]
    runs-on: [self-hosted, Linux, X64, masihawam-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false

      - name: Deploy the published image
        shell: bash
        run: |
          set -euo pipefail
          env_file="$HOME/masihawam/.env"
          test -f "$env_file" || { echo "Missing $env_file on the runner."; exit 1; }
          export DOCKER_GID="$(stat -c %g /var/run/docker.sock)"
          # The publish step tags the image with the commit this run was started on.
          export APP_TAG="sha-$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          docker pull ghcr.io/farismnrr/agentic-ai-workspace-sandbox:latest
          docker rm -f agentic-sandbox 2>/dev/null || true
          docker compose -f compose.prod.yaml --env-file "$env_file" pull
          docker compose -f compose.prod.yaml --env-file "$env_file" up -d --remove-orphans

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:5004/api/health | grep -q '"status":"ok"'

      - name: Show the app log when the deploy fails
        if: failure()
        shell: bash
        run: docker logs --tail 80 masihawam-app-1 || true

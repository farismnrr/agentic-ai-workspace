name: Landing Visual Debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/landing-visual-debug.yml"
      - "web/src/features/landing/**"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build production app
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          make backend-build

      - name: Install isolated Playwright
        run: |
          mkdir -p /tmp/visual
          cd /tmp/visual
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.64.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start production binary
        run: |
          PORT=8080 ./bin/agentic-ai-workspace > /tmp/landing-app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/landing-app.log
          exit 1

      - name: Exercise and capture landing
        run: |
          cat > /tmp/visual/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { mkdir, writeFile } from 'node:fs/promises';

          const browser = await chromium.launch();
          const output = `${process.env.GITHUB_WORKSPACE}/visual`;
          await mkdir(output, { recursive: true });
          const report = {};

          function overlaps(a, b) {
            return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
          }

          async function assertNoPageOverflow(page, label) {
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            if (overflow > 1) throw new Error(`${label} horizontal overflow: ${overflow}px`);
            return overflow;
          }

          async function inspectHero(page, label, desktop) {
            const hero = page.locator('main > section').first();
            const travel = await hero.evaluate((node) => node.clientHeight - window.innerHeight);
            const states = [
              [0, 'One goal. One orchestrator.', '.agent-shell'],
              [1 / 3, 'It routes the work.', '.agent-orchestrator'],
              [2 / 3, 'Agents work in the open.', '.agent-editor'],
              [1, 'Proof closes the loop.', '.agent-status'],
            ];
            let firstShellWidth = 0;

            for (const [index, [progress, heading, focal]] of states.entries()) {
              await page.evaluate((y) => window.scrollTo(0, y), travel * progress);
              await page.waitForTimeout(550);
              const active = page.getByRole('heading', { name: heading });
              if (!(await active.isVisible())) throw new Error(`${label} hero heading missing: ${heading}`);
              const copyBox = await active.locator('xpath=ancestor::article').boundingBox();
              const focalBox = await page.locator(focal).boundingBox();
              const shellBox = await page.locator('.agent-shell').boundingBox();
              if (copyBox === null || focalBox === null || shellBox === null) throw new Error(`${label} missing hero geometry at ${heading}`);
              if (overlaps(copyBox, focalBox)) throw new Error(`${label} hero focal overlap at ${heading}`);
              if (desktop) {
                const visibleOverlap = await page.locator('.agent-workspace-panel').evaluateAll((nodes, box) => nodes.some((node) => {
                  const opacity = Number.parseFloat(getComputedStyle(node).opacity);
                  if (opacity < 0.65) return false;
                  const rect = node.getBoundingClientRect();
                  return box.left < rect.right && box.right > rect.left && box.top < rect.bottom && box.bottom > rect.top;
                }), copyBox);
                if (visibleOverlap) throw new Error(`${label} hero copy overlaps a visible panel at ${heading}`);
              }
              if (index === 0) {
                firstShellWidth = shellBox.width;
                const minimum = desktop ? 1050 : page.viewportSize().width * 0.9;
                if (shellBox.width < minimum) throw new Error(`${label} hero workspace too small: ${shellBox.width}px`);
                if (shellBox.top < copyBox.bottom + 12) throw new Error(`${label} hero workspace too close to copy`);
              }
              if (index === 3 && shellBox.width > firstShellWidth * 0.82) throw new Error(`${label} hero workspace did not shrink enough`);
              if (index === 3) {
                const viewport = page.viewportSize();
                if (focalBox.left < -1 || focalBox.right > viewport.width + 1) throw new Error(`${label} verify status clipped`);
              }
              await page.screenshot({ path: `${output}/${label}-hero-${index}.png` });
            }
            return firstShellWidth;
          }

          async function inspectViews(page, label) {
            await page.locator('#closer-look').scrollIntoViewIfNeeded();
            for (const view of ['Changes', 'Preview', 'Verify']) {
              await page.getByRole('button', { name: view }).click();
              await page.waitForTimeout(120);
              await assertNoPageOverflow(page, `${label}-${view}`);
            }
            if (!(await page.getByRole('heading', { name: '4 checks passed' }).isVisible())) throw new Error(`${label} verify view did not render`);
          }

          async function inspect(label, viewport, scheme, desktop = false) {
            const context = await browser.newContext({ colorScheme: scheme, viewport });
            const page = await context.newPage();
            const errors = [];
            page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(600);
            const overflow = await assertNoPageOverflow(page, label);
            const firstShellWidth = await inspectHero(page, label, desktop);
            await inspectViews(page, label);
            await page.screenshot({ path: `${output}/${label}-full.png`, fullPage: true });
            if (errors.length > 0) throw new Error(`${label} browser errors: ${errors.join(' | ')}`);
            report[label] = { errors, overflow, firstShellWidth, theme: await page.evaluate(() => document.documentElement.dataset.theme) };
            await context.close();
          }

          await inspect('desktop-light', { width: 1536, height: 900 }, 'light', true);
          await inspect('desktop-dark', { width: 1536, height: 900 }, 'dark', true);
          await inspect('tablet-portrait', { width: 768, height: 1024 }, 'light');
          await inspect('tablet-landscape', { width: 1024, height: 768 }, 'light');
          await inspect('mobile', { width: 390, height: 844 }, 'light');

          await browser.close();
          await writeFile(`${output}/report.json`, JSON.stringify(report, null, 2));
          EOF
          cd /tmp/visual
          node capture.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-visual-debug
          path: visual
          if-no-files-found: warn
          retention-days: 1

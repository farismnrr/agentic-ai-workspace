name: Landing Visual Debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/landing-visual-debug.yml"
      - "web/src/features/landing/**"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build production app
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          make backend-build

      - name: Install isolated Playwright
        run: |
          mkdir -p /tmp/visual
          cd /tmp/visual
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.64.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start production binary
        run: |
          PORT=8080 ./bin/agentic-ai-workspace > /tmp/landing-app.log 2>&1 &
          echo $! > /tmp/landing-app.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/landing-app.log
          exit 1

      - name: Capture landing walkthrough
        run: |
          cat > /tmp/visual/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { mkdir, writeFile } from 'node:fs/promises';

          const browser = await chromium.launch();
          const report = {};
          await mkdir('visual', { recursive: true });

          for (const scheme of ['light', 'dark']) {
            const context = await browser.newContext({
              colorScheme: scheme,
              deviceScaleFactor: 1,
              viewport: { width: 1440, height: 1000 },
            });
            const page = await context.newPage();
            const errors = [];
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(message.text());
            });
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);
            await page.screenshot({ path: `visual/${scheme}-full.png`, fullPage: true });

            const height = await page.evaluate(() => document.documentElement.scrollHeight);
            const frames = [0, 0.16, 0.34, 0.52, 0.7, 0.88];
            for (let index = 0; index < frames.length; index += 1) {
              await page.evaluate((ratio) => window.scrollTo(0, document.documentElement.scrollHeight * ratio), frames[index]);
              await page.waitForTimeout(450);
              await page.screenshot({ path: `visual/${scheme}-${index}.png` });
            }

            report[scheme] = {
              errors,
              height,
              theme: await page.evaluate(() => document.documentElement.dataset.theme),
            };
            await context.close();
          }

          await browser.close();
          await writeFile('visual/report.json', JSON.stringify(report, null, 2));
          EOF
          cd /tmp/visual
          node capture.mjs
          cp -R visual "$GITHUB_WORKSPACE/visual"

      - name: Upload visual evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-visual-debug
          path: visual
          if-no-files-found: error
          retention-days: 1

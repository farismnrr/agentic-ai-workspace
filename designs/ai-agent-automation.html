<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Automations</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #2267ef;
      --blue-soft: #5f89ee;
      --ink: #0d1528;
      --muted: #657187;
      --line: #b9cdf8;
      --card-border: #e6edf9;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--ink);
      background: #fcfdff;
    }

    button {
      font: inherit;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 82% 77%, rgba(52, 112, 245, .15) 0, rgba(62, 119, 245, .075) 22%, transparent 48%),
        radial-gradient(circle at 58% 40%, rgba(85, 131, 245, .045), transparent 38%),
        linear-gradient(180deg, #fcfdff 0%, #fbfdff 58%, #f6f9ff 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(93, 126, 184, .12) .8px, transparent .9px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.22), rgba(0,0,0,.82) 38%, rgba(0,0,0,.5));
    }

    .page::after {
      content: "";
      position: absolute;
      width: 58vw;
      height: 58vw;
      right: -25vw;
      bottom: -34vw;
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(51, 111, 245, .16), rgba(77, 129, 247, .05) 46%, transparent 72%);
      filter: blur(8px);
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* -------------------------------------------------
       COPY — positioned from the viewport, not a max-width
       wrapper, so the reference proportions stay stable.
    ------------------------------------------------- */

    .copy {
      position: absolute;
      z-index: 20;
      left: 6.8vw;
      top: 7.5vh;
      width: min(58vw, 690px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 31px;
      padding: 6px 10px;
      margin-bottom: 4.4vh;
      border: 1px solid rgba(74, 122, 230, .12);
      border-radius: 7px;
      color: #6286dc;
      background: rgba(240, 245, 255, .82);
      box-shadow: 0 8px 22px rgba(49, 91, 176, .045);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .eyebrow svg {
      width: 14px;
      height: 14px;
    }

    h1 {
      font-size: clamp(49px, 7.25vh, 70px);
      line-height: 1.035;
      letter-spacing: -.052em;
      font-weight: 500;
      text-wrap: balance;
    }

    h1 .line {
      display: block;
      white-space: nowrap;
    }

    h1 .blue {
      color: var(--blue);
    }

    .description {
      width: min(43vw, 490px);
      margin-top: 3.2vh;
      color: var(--muted);
      font-size: clamp(14px, 1.75vh, 17px);
      line-height: 1.65;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-width: 154px;
      min-height: 52px;
      margin-top: 4vh;
      padding: 0 25px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(180deg, #4d8bff 0%, #2f73f6 38%, #195ddd 100%);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.52),
        0 10px 22px rgba(31, 97, 232, .22);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.52),
        0 15px 30px rgba(31, 97, 232, .27);
    }

    .cta-arrow {
      margin-top: -1px;
      font-size: 20px;
      line-height: 1;
    }

    /* -------------------------------------------------
       GRAPH / CONNECTORS
    ------------------------------------------------- */

    .scene {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .path {
      fill: none;
      stroke: #c4d6fb;
      stroke-width: 1.8;
      stroke-dasharray: 3 7;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      opacity: .8;
    }

    .path-blue {
      stroke: #567ee8;
      stroke-width: 2.2;
      opacity: .95;
    }

    .wire {
      fill: none;
      stroke: rgba(181, 199, 232, .44);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    /* -------------------------------------------------
       CENTRAL HUB
    ------------------------------------------------- */

    .hub {
      position: absolute;
      left: 52.7%;
      top: 55.4%;
      width: clamp(205px, 27vh, 245px);
      aspect-ratio: 2.08 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: linear-gradient(180deg, #4b85fa 0%, #1760e7 66%, #0e55dc 100%);
      box-shadow:
        0 20px 27px rgba(37, 91, 196, .16),
        0 8px 0 rgba(22, 81, 211, .08);
    }

    .hub::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -12%;
      height: 86%;
      border-radius: 50%;
      border: 1px solid #e2e9f7;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 72%, #eef3ff 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 5px 10px rgba(83, 113, 174, .05);
    }

    .hub::after {
      content: "";
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 5%;
      height: 25%;
      border-radius: 0 0 50% 50%;
      background: linear-gradient(180deg, rgba(48, 117, 248, .08), rgba(14, 83, 216, .14));
      filter: blur(1px);
    }

    .brand-logo {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 31%;
      width: 82px;
      height: 48px;
      transform: translate(-50%, -50%);
    }

    .brand-logo span {
      position: absolute;
      display: block;
      width: 23px;
      height: 42px;
      border-radius: 4px;
      background: linear-gradient(180deg, #2667f2, #1658dc);
      transform: skewY(31deg) rotate(10deg);
      box-shadow: 0 2px 2px rgba(20, 76, 187, .08);
    }

    .brand-logo span:nth-child(1) { left: 5px; top: 5px; }
    .brand-logo span:nth-child(2) { left: 29px; top: -3px; }
    .brand-logo span:nth-child(3) { left: 54px; top: 5px; }

    /* -------------------------------------------------
       ISOMETRIC WORKFLOW CARDS
    ------------------------------------------------- */

    .iso-card {
      position: absolute;
      border: 1px solid #e1e9f7;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,.99), rgba(251,253,255,.98));
      transform: rotate(-14deg) skewX(-5deg);
      transform-origin: center;
      box-shadow:
        -1px 7px 0 #dce7fb,
        0 20px 34px rgba(45, 80, 150, .08);
    }

    .iso-card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -7px;
      height: 8px;
      z-index: -1;
      border-radius: 0 0 7px 7px;
      background: linear-gradient(180deg, #eef3ff, #dfe9fb);
    }

    .iso-card::after {
      content: "";
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 13px;
      height: 3px;
      border-radius: 999px;
      background: #edf2fa;
    }

    .card-1 {
      left: 62.1%;
      top: 34.5%;
      width: clamp(188px, 24vh, 218px);
      height: clamp(76px, 10.3vh, 93px);
    }

    .card-2 {
      left: 76.3%;
      top: 20.9%;
      width: clamp(174px, 22vh, 202px);
      height: clamp(70px, 9.5vh, 86px);
    }

    .card-3 {
      left: 88.2%;
      top: 8.2%;
      width: clamp(160px, 20vh, 184px);
      height: clamp(65px, 8.7vh, 79px);
    }

    .fake-line {
      position: absolute;
      right: 18px;
      height: 6px;
      border-radius: 99px;
      background: #edf2f9;
    }

    .fake-line.one { top: 24%; width: 39%; }
    .fake-line.two { top: 41%; width: 49%; }
    .fake-line.three { top: 58%; width: 32%; }

    .mini-icon {
      position: absolute;
      left: 12%;
      top: 29%;
      width: 22%;
      height: 41%;
      transform: skewX(5deg) rotate(14deg);
    }

    .mini-icon.blocks {
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .mini-icon.blocks span {
      flex: 1;
      height: 74%;
      border: 2px solid #b9c5df;
      border-radius: 4px;
      background: #f8faff;
      box-shadow: inset 0 -5px 0 #e8eef9;
    }

    .mini-icon.chart {
      border: 3px solid #bac5de;
      border-radius: 50%;
    }

    .mini-icon.chart::before {
      content: "";
      position: absolute;
      inset: 20% 14%;
      border: 3px solid #c0cae1;
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(-28deg);
    }

    .mini-icon.db span {
      position: absolute;
      width: 38%;
      aspect-ratio: 1;
      border: 2px solid #bec8df;
      border-radius: 50%;
      background: #fff;
    }

    .mini-icon.db span:nth-child(1) { left: 0; bottom: 2px; }
    .mini-icon.db span:nth-child(2) { left: 31%; top: 0; }
    .mini-icon.db span:nth-child(3) { right: 0; bottom: 2px; }

    /* -------------------------------------------------
       INTEGRATION TILES
    ------------------------------------------------- */

    .integration {
      position: absolute;
      width: clamp(58px, 8.6vh, 72px);
      aspect-ratio: 1.42 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(255,255,255,.98);
      transform: rotate(-15deg) skewX(-5deg);
      box-shadow:
        -1px 7px 0 #e0e8f4,
        0 17px 28px rgba(49, 77, 128, .08);
    }

    .integration svg {
      width: 42%;
      height: 58%;
      transform: skewX(5deg) rotate(15deg);
    }

    .hubspot { left: 8.4%; top: 69.3%; }
    .sheets  { left: 24.2%; top: 59.5%; }
    .gmail   { left: 21.2%; top: 78.2%; }
    .youtube { left: 37.4%; top: 78.5%; }
    .cloud   { left: 24.2%; top: 92%; opacity: .64; }

    /* -------------------------------------------------
       CHAT CARD
    ------------------------------------------------- */

    .chat {
      position: absolute;
      z-index: 16;
      right: 3.7vw;
      bottom: 5.3vh;
      width: clamp(390px, 35vw, 485px);
      height: clamp(150px, 20.8vh, 178px);
      padding: 24px 25px;
      border: 1px solid rgba(224, 232, 246, .9);
      border-radius: 15px;
      background: rgba(255,255,255,.96);
      box-shadow:
        0 32px 70px rgba(51, 91, 169, .10),
        0 9px 25px rgba(67, 94, 145, .055);
      backdrop-filter: blur(15px);
      pointer-events: auto;
    }

    .chat-placeholder {
      color: #9ba4b2;
      font-size: 14px;
    }

    .chat-footer {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-actions,
    .right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .circle-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #edf0f5;
      border-radius: 50%;
      color: #9da6b3;
      background: #fff;
      cursor: pointer;
    }

    .web-search {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid #edf0f5;
      border-radius: 999px;
      color: #677181;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .web-search svg {
      width: 14px;
      height: 14px;
    }

    .mic {
      color: #a7afbc;
    }

    .send {
      position: relative;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(180deg, #5f91ff, #2e6df0);
      box-shadow:
        0 7px 16px rgba(31,96,232,.28),
        inset 0 1px 1px rgba(255,255,255,.48);
      cursor: pointer;
    }

    .send::before,
    .send::after {
      content: "";
      position: absolute;
      border-radius: 99px;
      background: #fff;
    }

    .send::before {
      width: 13px;
      height: 2px;
      left: 13px;
      top: 19px;
      transform: rotate(-35deg);
    }

    .send::after {
      width: 8px;
      height: 2px;
      left: 20px;
      top: 15px;
      transform: rotate(50deg);
    }

    /* Desktop height tuning: keep the entire composition in one viewport. */
    @media (max-height: 780px) and (min-width: 821px) {
      .copy { top: 5.2vh; }
      .eyebrow { margin-bottom: 3vh; }
      h1 { font-size: clamp(47px, 7.2vh, 58px); }
      .description { margin-top: 2.4vh; }
      .cta { margin-top: 2.8vh; min-height: 48px; }
      .hub { top: 56.5%; }
      .chat { bottom: 3vh; }
    }

    @media (max-width: 1100px) and (min-width: 821px) {
      .copy { left: 5.5vw; width: 58vw; }
      h1 { font-size: clamp(48px, 7vh, 62px); }
      .description { width: 46vw; }
      .hub { left: 54%; }
      .card-1 { left: 64%; }
      .card-2 { left: 78%; }
      .card-3 { left: 89%; }
      .chat { right: 2.5vw; width: min(39vw, 440px); }
    }

    /* Mobile becomes a normal scrollable composition instead of squeezing the desktop art. */
    @media (max-width: 820px) {
      html,
      body {
        overflow: auto;
      }

      .page {
        min-height: 980px;
        height: auto;
        overflow: hidden;
      }

      .hero {
        min-height: 980px;
      }

      .copy {
        left: 7vw;
        right: 7vw;
        top: 48px;
        width: auto;
      }

      .eyebrow {
        margin-bottom: 26px;
      }

      h1 {
        font-size: clamp(44px, 11vw, 62px);
      }

      h1 .line {
        white-space: normal;
      }

      .description {
        width: min(92%, 480px);
        margin-top: 22px;
        font-size: 16px;
      }

      .cta {
        margin-top: 26px;
      }

      .hub {
        left: 55%;
        top: 58%;
      }

      .card-1 { left: 57%; top: 42%; }
      .card-2 { left: 70%; top: 33%; }
      .card-3 { left: 82%; top: 24%; }

      .hubspot { left: 5%; top: 62%; }
      .sheets { left: 20%; top: 54%; }
      .gmail { left: 19%; top: 72%; }
      .youtube { left: 39%; top: 73%; }
      .cloud { left: 24%; top: 82%; }

      .chat {
        left: 50%;
        right: auto;
        bottom: 34px;
        width: min(90vw, 460px);
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="copy">
        <div class="eyebrow">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2l1.8 5.1L19 9l-5.2 1.9L12 16l-1.8-5.1L5 9l5.2-1.9L12 2Z" fill="currentColor"/>
            <path d="M19 14l.9 2.5L22 17.3l-2.1.8L19 21l-.9-2.9-2.1-.8 2.1-.8L19 14Z" fill="currentColor" opacity=".55"/>
          </svg>
          AI SOLUTION
        </div>

        <h1>
          <span class="line">Turn workflow into</span>
          <span class="line"><span class="blue">AI agent</span> automations.</span>
        </h1>

        <p class="description">
          Powerful and production-ready, our cloud platform has the solutions you need to succeed.
        </p>

        <button class="cta" type="button">
          Get started <span class="cta-arrow">›</span>
        </button>
      </div>

      <div class="scene">
        <svg class="connections" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path class="path path-blue" d="M53 55 C59 50 63 46 68.5 41.5 C74 36.8 78 32.5 82 27.7 C87 21.8 91 17 95 13"/>
          <path class="path" d="M52 56 C42 61 35 65 27 68 C20 71 15 75 10 79"/>
          <path class="path" d="M27 68 C24 64 23 61 26 58"/>
          <path class="path" d="M26 58 C31 62 33 67 34 73"/>
          <path class="path" d="M34 73 C30 78 27 84 25 92"/>
          <path class="wire" d="M8 88 C25 76 37 66 52 56"/>
        </svg>

        <div class="hub" aria-hidden="true">
          <div class="brand-logo"><span></span><span></span><span></span></div>
        </div>

        <div class="iso-card card-1" aria-hidden="true">
          <div class="mini-icon blocks"><span></span><span></span><span></span></div>
          <div class="fake-line one"></div>
          <div class="fake-line two"></div>
          <div class="fake-line three"></div>
        </div>

        <div class="iso-card card-2" aria-hidden="true">
          <div class="mini-icon chart"></div>
          <div class="fake-line one"></div>
          <div class="fake-line two"></div>
          <div class="fake-line three"></div>
        </div>

        <div class="iso-card card-3" aria-hidden="true">
          <div class="mini-icon db"><span></span><span></span><span></span></div>
          <div class="fake-line one"></div>
          <div class="fake-line two"></div>
        </div>

        <div class="integration hubspot" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="9" cy="17" r="3" stroke="#ef654a" stroke-width="2.4"/>
            <circle cx="23" cy="10" r="3" stroke="#ef654a" stroke-width="2.4"/>
            <circle cx="22" cy="24" r="3" stroke="#ef654a" stroke-width="2.4"/>
            <path d="M11.5 15.5L20.5 11.5M11.5 18.5L19.5 22.5M23 13V21" stroke="#ef654a" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="integration sheets" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <rect x="7" y="4" width="18" height="24" rx="2" fill="#29a866"/>
            <path d="M11 11h10M11 15h10M11 19h10M14 10v11M18 10v11" stroke="white" stroke-width="1.4"/>
          </svg>
        </div>

        <div class="integration gmail" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M5 9L16 17L27 9" stroke="#EA4335" stroke-width="3"/>
            <path d="M5 9V24" stroke="#4285F4" stroke-width="3"/>
            <path d="M27 9V24" stroke="#34A853" stroke-width="3"/>
            <path d="M5 24H27" stroke="#FBBC05" stroke-width="3"/>
          </svg>
        </div>

        <div class="integration youtube" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <rect x="4" y="8" width="24" height="16" rx="5" fill="#ff2f2f"/>
            <path d="M14 12.5L21 16L14 19.5V12.5Z" fill="white"/>
          </svg>
        </div>

        <div class="integration cloud" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M9 22h14a5 5 0 0 0 0-10 7 7 0 0 0-13-2A6 6 0 0 0 9 22Z" fill="#50B5E9"/>
          </svg>
        </div>
      </div>

      <div class="chat">
        <div class="chat-placeholder">Ask anythings ...</div>

        <div class="chat-footer">
          <div class="chat-actions">
            <button class="circle-button" type="button">+</button>

            <button class="web-search" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/>
                <path d="M4 12h16M12 4c2 2.3 3 5 3 8s-1 5.7-3 8c-2-2.3-3-5-3-8s1-5.7 3-8Z" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              Web Search
            </button>
          </div>

          <div class="right-actions">
            <svg class="mic" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="9" y="4" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="M6 11a6 6 0 0012 0M12 17v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>

            <button class="send" type="button" aria-label="Send"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const cta = document.querySelector('.cta');
    const send = document.querySelector('.send');

    cta.addEventListener('click', () => {
      cta.animate(
        [
          { transform: 'scale(1)' },
          { transform: 'scale(.96)' },
          { transform: 'scale(1)' }
        ],
        { duration: 220, easing: 'ease-out' }
      );
    });

    send.addEventListener('click', () => {
      send.animate(
        [
          { transform: 'scale(1)' },
          { transform: 'scale(.88)' },
          { transform: 'scale(1)' }
        ],
        { duration: 200, easing: 'ease-out' }
      );
    });
  </script>
</body>
</html>

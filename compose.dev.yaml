# Development channel: follows the image published from dev (:dev).
# One service: the app, on the host network. Checks run as short-lived containers started through the Docker
# socket, so the socket is mounted. Anyone who can reach the socket controls the host:
# run Docker rootless where you can, and keep this server's sign-ups to people you trust.
#
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose -f compose.dev.yaml up -d
#
# Settings come from the shell or a .env file next to this one (PUBLIC_URL, CONNECTOR_URL,
# ALLOWED_ORIGINS, ...), see docs/deployment.md.
# The image is pulled from GHCR. To use a local build instead, run `make image` first.
services:
  # The toolbox the AI's commands run in. It is never a long-running service: it exists so that
  # `docker compose pull` and `up` fetch the image with the app, and the app starts only once it is present.
  sandbox:
    image: ${SANDBOX_IMAGE:-ghcr.io/farismnrr/agentic-ai-workspace-sandbox:latest}
    entrypoint: ["true"]
    network_mode: none
    restart: "no"
  app:
    depends_on:
      sandbox:
        condition: service_completed_successfully
    image: ghcr.io/farismnrr/agentic-ai-workspace:dev
    # The host's network, so "localhost" in Settings means this computer: a model gateway
    # that listens on the host's loopback is then reachable (the egress rule allows only
    # loopback for gateways). The app listens on PORT directly; checks still get no network.
    network_mode: host
    environment:
      PORT: ${PORT:-8081}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
      CONNECTOR_URL: ${CONNECTOR_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Workspaces are handed to the check containers as sub-paths of this volume.
      SANDBOX_DATA_VOLUME: agentic-data
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/farismnrr/agentic-ai-workspace-sandbox:latest}
      SANDBOX_EGRESS_HOSTS: ${SANDBOX_EGRESS_HOSTS:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-2048}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      MAX_SANDBOXES: ${MAX_SANDBOXES:-4}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    volumes:
      - agentic-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID=$(stat -c %g /var/run/docker.sock)}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  agentic-data:
    # A fixed name: the app refers to this volume when it starts check containers.
    name: agentic-data
